server:
  port: ${API_GATEWAY_PORT:4003}

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: http://host.docker.internal:${AUTH_SERVICE_PORT:4004}
          predicates:
            - Path=/auth/**
          filters:
          - StripPrefix=1

        - id: patient-service-route
          uri: http://host.docker.internal:${PATIENT_SERVICE_PORT:4000}
          predicates:
            - Path=/api/patients/**
          filters:
            - StripPrefix=1
            - JwtValidation

        - id: api-docs-auth-route
          uri: http://host.docker.internal:${AUTH_SERVICE_PORT:4004}
          predicates:
            - Path=/api-docs/auth
          filters:
            - RewritePath=/api-docs/auth,/v3/api-docs

        - id: api-docs-patient-route
          uri: http://host.docker.internal:${PATIENT_SERVICE_PORT:4000}
          predicates:
            - Path=/api-docs/patients
          filters:
            - RewritePath=/api-docs/patients,/v3/api-docs

        # - id: billing-service-route

        # - id: analytics-service-route